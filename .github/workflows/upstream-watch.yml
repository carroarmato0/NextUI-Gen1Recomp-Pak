name: Upstream watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the upstream tag has not moved'
        type: boolean
        default: false

# Watches bryanthaboi/gen1recomp for a new release, repackages, and then stops.
#
# It deliberately does NOT publish. The Pak Store serves release_filename from the
# latest *published* release, so auto-publishing would push an untested build to
# everyone who has the pak installed -- and CI cannot see any of the failure modes
# that matter here (GLES, audio, input, the voxel mod's memory ceiling). The output
# is therefore a draft release plus an issue carrying the device checklist, and a
# human publishes after running scripts/verify-device.sh.
#
# EVERYTHING THIS WORKFLOW WRITES IS ROLLING -- one branch, one draft, one issue,
# always describing the newest upstream release. Upstream ships every few days and
# a repin is often skipped, so keying each artifact to the upstream tag left three
# dead branches, two drafts fighting over one version number and two stale
# checklists behind in four days. A superseded repin carries no information: the
# lock is regenerated wholesale from the newest release, so the older branch is
# not a smaller step toward it, just an older answer.
#
# There is no PR step, for two reasons. This repo has "Allow GitHub Actions to
# create and approve pull requests" off, so `gh pr create` failed on every run
# with "GitHub Actions is not permitted to create or approve pull requests" --
# masked by a `|| echo "PR already exists"` that swallowed the real error and let
# the run go green. And a PR whose diff is only ever two generated files adds a
# review surface without adding information: review the branch, which the
# checklist issue links as a compare against main.
#
# Long issue/release bodies live in .github/templates/ rather than inline heredocs:
# unindented heredoc content terminates a YAML block scalar, and the templates are
# easier to review as prose anyway.

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.check.outputs.moved }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=$(jq -r .gen1recomp.repo upstream.lock)
          have=$(jq -r .gen1recomp.tag upstream.lock)
          latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
          echo "pinned=$have latest=$latest"
          if [ "$have" = "$latest" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "Already on $have -- nothing to do."
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

  repackage:
    needs: watch
    if: needs.watch.outputs.moved == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq zip unzip binutils shellcheck lua-check gettext-base

      - name: Repin and build
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/build.sh --refresh-lock
          {
            echo "upstream_version=$(jq -r .gen1recomp.version upstream.lock)"
            echo "upstream_tag=$(jq -r .gen1recomp.tag upstream.lock)"
          } >> "$GITHUB_OUTPUT"

      # MUST come before the checks below, not after. verify.sh asserts that
      # pak.json's description names the upstream version in upstream.lock, and
      # --refresh-lock has just moved that version -- so with this step after the
      # checks, EVERY upstream move failed "description names the bundled
      # Gen1Recomp version", tripped the contract-failure path and filed an issue
      # blaming upstream for our own step ordering. The watcher could never
      # complete a repin. First seen for real on 2026-08-12 (upstream 0.1.79),
      # which is also the first time upstream moved since this workflow was written.
      - name: Bump the pak patch version and changelog
        id: bump
        env:
          UPSTREAM: ${{ steps.build.outputs.upstream_version }}
        run: |
          set -euo pipefail
          # The pak's version is independent of upstream's, so a new upstream build
          # is a patch bump here. The upstream version is recorded in the changelog
          # and the description so a user can tell what they actually have.
          cur=$(jq -r .version pak.json)
          base=${cur#v}
          major=${base%%.*}; rest=${base#*.}
          minor=${rest%%.*}; patch=${rest#*.}
          new="v$major.$minor.$((patch+1))"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

          # --indent 4, matching the file. jq defaults to compact with -c, which
          # would collapse pak.json onto one line and make the bot's own PR diff
          # unreviewable -- the changelog entries are long prose.
          jq --indent 4 --arg v "$new" --arg up "$UPSTREAM" '
            .version = $v
            | .description = (.description
                | sub("Gen1Recomp [0-9]+\\.[0-9]+\\.[0-9]+"; "Gen1Recomp " + $up))
            | .changelog = ({ ($v): ["Updated to Gen1Recomp " + $up + "."] } + .changelog)
          ' pak.json > pak.json.tmp
          mv pak.json.tmp pak.json
          echo "pak.json now at $new (Gen1Recomp $UPSTREAM)"

      # A contract failure is the whole point of this workflow: it means upstream
      # changed something launch.sh depends on. Surface it as an issue instead of
      # quietly producing a broken draft. This now runs against a pak.json that
      # has already been bumped, so a failure here is genuinely upstream's.
      # (The bump step used to re-run verify.sh --skip-lint itself; it no longer
      # needs to, since the full check runs immediately after and routes a failure
      # through the issue path instead of dying with a bare non-zero exit.)
      - name: Static and contract checks
        id: verify
        continue-on-error: true
        run: scripts/verify.sh

      - name: Report a broken contract and stop
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed "s|@TAG@|${{ steps.build.outputs.upstream_tag }}|g" \
            .github/templates/contract-failure.md > /tmp/body.md
          title="Upstream ${{ steps.build.outputs.upstream_tag }} breaks a contract this pak depends on"
          # Rolling, like the rest: upstream releasing daily while a contract stays
          # broken would otherwise file the same issue every morning.
          gh label create upstream-contract --color B60205 --force \
            --description "The single rolling contract-failure report" >/dev/null
          open="$(gh issue list --label upstream-contract --state open \
            --json number -q '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue edit "$open" --title "$title" --body-file /tmp/body.md
            gh issue comment "$open" \
              --body "Still broken as of ${{ steps.build.outputs.upstream_tag }}. Body updated for that tag."
          else
            gh issue create --title "$title" --body-file /tmp/body.md \
              --label upstream-contract
          fi
          exit 1

      - name: Package
        run: scripts/release.sh --skip-verify

      # One branch, force-pushed, always holding the newest repin. Force is safe
      # here in a way it would not be on a human branch: the two files on it are
      # regenerated from scratch every run, so there is nothing on the old tip
      # that is not either superseded or still in main.
      - name: Push the rolling repin branch
        id: branch
        run: |
          set -euo pipefail
          branch=upstream/next
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add upstream.lock pak.json
          git commit -m "Update to Gen1Recomp ${{ steps.build.outputs.upstream_version }} (${{ steps.bump.outputs.new_version }})"
          git push origin "$branch" --force

      - name: Refresh the DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.new_version }}"
          # The pak version is patch+1 off MAIN, so every untaken repin proposes the
          # same tag. A draft on it is a previous repin nobody took -- replace it.
          # A PUBLISHED release on it means main was never bumped after a release,
          # which is a human mistake this must not paper over.
          state="$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo absent)"
          case "$state" in
            true)
              echo "Replacing the untaken draft on $tag"
              gh release delete "$tag" --yes
              ;;
            false)
              echo "::error::$tag is already published -- refusing to touch it. Bump pak.json on main."
              exit 1
              ;;
          esac
          sed "s|@UPSTREAM@|${{ steps.build.outputs.upstream_version }}|g" \
            .github/templates/draft-notes.md > /tmp/notes.md
          gh release create "$tag" --draft \
            --target "${{ steps.branch.outputs.branch }}" \
            --title "$tag (Gen1Recomp ${{ steps.build.outputs.upstream_version }})" \
            --notes-file /tmp/notes.md \
            dist/Gen1Recomp.pak.zip dist/Gen1Recomp.pakz

      - name: Update the device verification checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed -e "s|@NEW@|${{ steps.bump.outputs.new_version }}|g" \
              -e "s|@UPSTREAM@|${{ steps.build.outputs.upstream_version }}|g" \
              -e "s|@BRANCH@|${{ steps.branch.outputs.branch }}|g" \
            .github/templates/device-checklist.md > /tmp/checklist.md
          title="Verify ${{ steps.bump.outputs.new_version }} (Gen1Recomp ${{ steps.build.outputs.upstream_version }}) on device"
          gh label create upstream-repin --color 0E8A16 --force \
            --description "The single rolling repin checklist" >/dev/null
          open="$(gh issue list --label upstream-repin --state open \
            --json number -q '.[0].number // empty')"
          if [ -n "$open" ]; then
            # The body is REPLACED, ticks and all, on purpose: a box ticked against
            # an older engine build is not evidence about this one, and leaving it
            # ticked would read as though it were.
            gh issue edit "$open" --title "$title" --body-file /tmp/checklist.md
            note="Repinned to Gen1Recomp ${{ steps.build.outputs.upstream_version }};"
            gh issue comment "$open" --body "$note the checklist above was reset for it."
          else
            gh issue create --title "$title" --body-file /tmp/checklist.md \
              --label upstream-repin
          fi
