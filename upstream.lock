      "yellow": "cc7d03262ebfaf2f06772c1a480c7d9d5f4a38e1"
    },
    "_rom_sha256_comment": [
      "What launch.sh actually matches on. These devices ship sha256sum and md5sum",
      "but NO sha1sum (verified on a Trimui Brick, 2026-08-11), so the original",
      "SHA-1 scan matched nothing at all -- silently. Red and Blue were confirmed",
      "against real dumps on-device; Yellow follows by elimination from the same",
      "published set. A wrong value fails safe: the engine's own SHA-1 check still",
      "gates the import, so the player lands on Choose ROM, not on bad data."
    ],
    "rom_sha256": {
      "red": "5ca7ba01642a3b27b0cc0b5349b52792795b62d3ed977e98a09390659af96b7b",
      "blue": "2a951313c2640e8c2cb21f25d1db019ae6245d9c7121f754fa61afd7bee6452d",
      "yellow": "8cbaa499397e4f1a679c992ea9382a2dd7942ab398b48c19829c2d9529de47bf"
    },
    "_device_tools_comment": [
      "Commands confirmed ABSENT on a Trimui Brick and a Smart Pro S running NextUI",
      "(2026-08-11). launch.sh must not invoke any of these unless guarded by",
      "`command -v`, because the failure mode is silent: sha1sum produced no output and",
      "the ROM scan matched nothing, with no error logged anywhere. verify.sh enforces it.",
      "taskset is absent even from busybox, which is why big-core affinity uses a cpuset",
      "cgroup instead."
    ],
    "device_missing_tools": [
      "sha1sum",
      "stat",
      "openssl",
      "cksum",
      "nproc",
      "taskset"
    ],
    "_rom_discovery_comment": [
      "How the engine finds a dump on Linux, and therefore where launch.sh stages one.",
      "RomImporter.lua gates its baseroms/ scan behind baseRomDiscovery, which is set to",
      "`opts.launcher and Platform.isUWP()` -- Xbox only. On Linux it tries zenity/kdialog",
      "(absent on these handhelds) and then falls back to findPendingRom(), which scans the",
      "PhysFS root via getDirectoryItems(\"\") for a 1 MiB .gb/.gbc. LOVE mounts the save",
      "directory into that root, so launch.sh stages dumps at the top of the save dir.",
      "Staging them in a subfolder is invisible to the engine -- that cost a device trip.",
      "verify.sh asserts both facts so an upstream change to either is caught here."
    ],
    "rom_discovery": {
      "root_scan_fn": "findPendingRom",
      "root_scan_call": "getDirectoryItems(\"\")",
      "baseroms_is_uwp_only": true,
      "stage_at": "<savedir>/  (PhysFS root)"
    }
  },
  "ca_bundle": {
    "_comment": [
      "These devices ship NO CA store at all -- /etc/ssl/certs, /etc/ssl/cert.pem and",
      "/etc/pki are all absent. The engine does HTTPS by shelling out to curl",
      "(src/net/Fetch.lua, HostShell.httpGet via io.popen), so every request failed with",
      "curl exit 60, CURLE_PEER_FAILED_VERIFICATION -- which surfaced in the mod manager",
      "as a failed update check. Verified on a Trimui Brick, 2026-08-11: with",
      "CURL_CA_BUNDLE set, the same request returns HTTP 200.",
      "",
      "Mozilla's bundle as republished by the curl project. Pinned for reproducibility,",
      "so refreshing it is a deliberate act: run scripts/build.sh --refresh-ca, check the",
      "new hash in, and note that roots do expire -- a stale bundle fails closed and",
      "silently, exactly like having none."
    ],
    "url": "https://curl.se/ca/cacert.pem",
