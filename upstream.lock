      "the import dies at RomImporter.lua with ROM import metadata is missing. Chasing that",
      "file by file cost two releases; taking the whole payload from the .love ends the class",
      "of bug and picks up new versions for free.",
      "",
      "Verified on 0.1.79: the .love is a strict superset of the zips lovegame/ -- all 451",
      "shared files byte-identical, the .love adding only the two manifests, the zip adding",
