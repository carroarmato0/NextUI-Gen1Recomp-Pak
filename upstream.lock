  "mpg123": {
    "_comment": [
      "liblove-11.5.so lists libmpg123.so.0 among its NEEDED libraries (readelf -d), but",
      "neither the RG34XXSP port zip nor PortMaster's own love_11.5 runtime bundles it --",
      "both ship only liblove, libluajit, libmodplug and libogg (see love_runtime above).",
      "On PortMaster CFW the rest comes from the base install; on NextUI it was expected",
      "from the firmware. tg5040 (Trimui Brick) and tg5050 ship no libmpg123.so.0 in",
      "/usr/trimui/lib, so love.aarch64 died at load with:",
      "  error while loading shared libraries: libmpg123.so.0: cannot open shared object file",
      "It is the ONLY NEEDED library the firmware does not provide: the loader names",
      "libmpg123.so.0 rather than any of the entries before it (SDL2, freetype, openal, z,",
      "vorbisfile, theoradec, ...), which all resolve on device. So we bundle exactly it",
      "into bin/lib/ and add that directory to LD_LIBRARY_PATH in launch.sh.",
      "",
      "Sourced from Ubuntu 18.04 (bionic), whose mpg123 was built against glibc 2.27: this",
      "build needs only GLIBC_2.17 symbols (readelf -V), the aarch64 baseline, so it loads",
      "on any device this pak targets -- unlike a current Debian/Ubuntu build, which pulls in",
      "GLIBC_2.29+ math symbols. The SONAME is libmpg123.so.0, matching liblove's NEEDED.",
      "The URL is Launchpad's permanent librarian link (launchpadlibrarian.net/<id>/...) for",
      "the bionic arm64 libmpg123-0 1.25.10-1 publication -- file ids never change and the host",
      "is a plain CDN, unlike the launchpad.net/+files redirect, which throttled repeated pulls.",
      "The deb is pinned by sha256 and the extracted .so is re-pinned so verify.sh can catch a",
      "tampered or swapped library independently of the archive.",
      "",
      "mpg123 (libmpg123) is LGPL-2.1; shipping the shared library unmodified alongside our",
      "attribution satisfies it. See licenses/ATTRIBUTION.txt."
    ],
    "package": "libmpg123-0",
    "version": "1.25.10",
    "url": "https://launchpadlibrarian.net/360329959/libmpg123-0_1.25.10-1_arm64.deb",
    "deb_sha256": "bda129af2cf048f13215b12b38a32080e71ba9ddd260884b19593b1550c2d103",
    "member": "usr/lib/aarch64-linux-gnu/libmpg123.so.0.44.8",
    "so_sha256": "5b349374763a98a34ac20dfaaf86ed67e91d8a1c719c97732af97f26b21ac2f2",
    "install_path": "bin/lib/libmpg123.so.0"
  },
