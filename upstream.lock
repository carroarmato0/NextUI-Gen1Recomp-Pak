      "pak directory, and a pak update would then eat every save).",
      "",
      "The RUNTIME still comes from the rg34xxsp zip -- see love_runtime. That is deliberate:",
      "it is the exact LOVE build upstream tested this game version against, and it is",
      "hash-pinned per file. Nothing here is compiled either way; the game is Lua."
    ],
