  "_comment": [
    "Every third-party artifact this pak bundles, pinned by sha256. scripts/build.sh",
    "verifies each one and fails closed; scripts/verify.sh re-checks the assembled tree.",
    "The upstream-watch workflow diffs 'gen1recomp.tag' against the latest GitHub release",
    "and rewrites this file when it moves.",
    "",
    "Note on the LOVE runtime: the four libs plus the love stub are NOT downloaded",
    "separately from PortMaster. Upstream's RG34XXSP port zip already contains them, and",
    "they were confirmed byte-identical to PortMaster-GUI's love_11.5 aarch64 runtime on",
    "2026-08-11. Taking them from the release zip means one pinned download instead of six,",
    "and guarantees the runtime is the exact build upstream tested that game version with.",
    "The hashes below are therefore assertions about the zip's contents, not fetch targets --",
    "if upstream ever ships a different LOVE build, build.sh fails and a human decides."
  ],
