    "size": 5110563
  },
  "yellow_manifest": {
    "_comment": [
      "The rg34xxsp-stockos64-mod asset this pak is built from ships tools/rom_manifest.json",
      "(Red) and tools/rom_manifest_blue.json but NOT tools/rom_manifest_yellow.json -- while",
      "the engine in that same zip does know about Yellow (GameVersion.lua lists it with",
      "exactly that manifest path). So a Yellow dump imports as far as RomImporter.lua:264 and",
      "then dies with \"ROM import metadata is missing\". Reported on a Smart Pro S, 2026-08-12,",
      "and confirmed to be an upstream omission, not a build.sh bug: the file is simply absent",
      "from the zip. The .love asset of the SAME release carries it, so build.sh pulls that one",
      "member across.",
      "",
      "Only the archive is pinned. Its sha256 already determines every byte inside it, so a",
      "second hash for the extracted member would add nothing but an update chore -- unlike",
      "love_runtime above, where the per-file hashes exist to catch upstream swapping the LOVE",
      "build out from under us. Both this pin and gen1recomp move together on --update: a",
      "manifest from a different release than the engine that reads it is precisely the",
      "mismatch this lock exists to prevent."
    ],
    "asset": "gen1recomp-0.1.77.love",
    "sha256": "ba5dfb3067e05d0a289f5cdc74df1114d2f5093a2b9f972155e90e8d786aec90",
    "size": 3070184,
    "member": "tools/rom_manifest_yellow.json",
    "install_path": "game/tools/rom_manifest_yellow.json"
  },
