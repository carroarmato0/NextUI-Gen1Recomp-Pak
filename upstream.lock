  "game_payload": {
    "_comment": [
      "The GAME payload -- the Lua tree LOVE runs. Taken from the .love asset, which is",
      "upstreams canonical build of it, NOT from the rg34xxsp-stockos64-mod zips lovegame/",
      "directory. That zip is a downstream ports convenience bundle, and it is TRIMMED: it",
      "dropped tools/rom_manifest_yellow.json in 0.1.77 and rom_manifest_gold.json in 0.1.79 --",
