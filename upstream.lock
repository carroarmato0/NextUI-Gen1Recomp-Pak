    "_strip_comment": [
      "Libraries upstream ships in libs.aarch64/ that this pak deliberately does NOT install.",
      "",
      "liblibrashader_bridge.so (8.4 MB) arrived with src/render/ShaderFX.lua between 0.2.24",
      "and 0.2.39. It is ffi.load()ed for exactly one job: translating libretro .slangp presets",
      "into the cached Lua artifact ShaderFX runs. On this hardware that job never happens.",
      "Performance.detect() returns 'low' for arm/arm64 on Linux and CAPS.low.shaderfx is false,",
      "a hard off checked before any preset is looked at -- see contracts.shaderfx. The pak also",
      "ships no .slangp and a fresh save dir has none, so there is nothing to translate even if",
      "a player forces the tier to HIGH from OPTIONS.",
      "",
      "That made it 8.4 MB of the 15 MB the pak grew by at 0.2.43 (22 MB -> 37 MB), for a code",
      "path the engine refuses to enter, on 1 GB devices this pak already documents as memory-",
      "and GPU-bound. Stripped, the pak is ~29 MB.",
      "",
      "It fails GRACEFULLY if a player does reach for it: ShaderFX's ensureLib() walks its",
      "candidate paths under pcall and records libError, so a missing bridge is a logged",
      "conversion failure and no shader, not a crash. A player who wants presets can put their",
      "own build at any candidate path, or point LIBRASHADER_BRIDGE_DLL at one.",
      "",
      "build.sh copies the whole of libs.aarch64/ and then removes these by name, so a library",
      "nobody has seen before still reaches the staged tree and trips verify.sh's exact-name",
      "check. Dropping it at copy time would hide the next new dependency."
    ],
    "_strip_reason": "unreachable on these devices; see _strip_comment",
    "strip": [
      "libs.aarch64/liblibrashader_bridge.so"
    ]
  },
  "mpg123": {
    "_comment": [
      "liblove-11.5.so lists libmpg123.so.0 among its NEEDED libraries (readelf -d), but",
      "neither the RG34XXSP port zip nor PortMaster's own love_11.5 runtime bundles it --",
      "both ship only liblove, libluajit, libmodplug and libogg (see love_runtime above).",
      "On PortMaster CFW the rest comes from the base install; on NextUI it is expected",
      "from the firmware -- and WHETHER THE FIRMWARE HAS IT VARIES BY IMAGE. On an image",
      "without one, love.aarch64 dies at load with:",
      "  error while loading shared libraries: libmpg123.so.0: cannot open shared object file",
      "which is issue #1, reported against a clean NextUI flash on a Brick. It is the ONLY",
      "NEEDED library that can be missing: the loader names libmpg123.so.0 rather than any",
      "of the entries before it (SDL2, freetype, openal, z, vorbisfile, theoradec, ...),",
      "which all resolve on device. So we bundle exactly it into bin/lib/.",
      "",
      "bin/lib goes LAST on LD_LIBRARY_PATH, after /usr/trimui/lib. Do not reverse that.",
      "A Brick measured on 2026-08-13 ships libmpg123.so.0.44.12 (Nov 2025) and runs fine",
      "with no bundle at all, while this pinned build is 0.44.8 (2018) -- so searching",
      "bin/lib first would silently swap a current decoder for a seven-year-old one on",
      "every device that already worked. Verified with LD_DEBUG=libs in both orders, and",
      "against a mirror of /usr/trimui/lib with libmpg123 removed to simulate an affected",
      "image: firmware copy wins when present, ours loads when it is not, LOVE starts in",
      "both cases.",
      "",
      "Sourced from Ubuntu 18.04 (bionic), whose mpg123 was built against glibc 2.27: this",
      "build needs only GLIBC_2.17 symbols (readelf -V), the aarch64 baseline, so it loads",
      "on any device this pak targets -- unlike a current Debian/Ubuntu build, which pulls in",
      "GLIBC_2.29+ math symbols. The SONAME is libmpg123.so.0, matching liblove's NEEDED.",
      "The URL is Launchpad's permanent librarian link (launchpadlibrarian.net/<id>/...) for",
      "the bionic arm64 libmpg123-0 1.25.10-1 publication -- file ids never change and the host",
      "is a plain CDN, unlike the launchpad.net/+files redirect, which throttled repeated pulls.",
      "That host has been seen unreachable from some networks; the identical bytes are also at",
      "ports.ubuntu.com/pool/main/m/mpg123/ if it ever has to be swapped (same sha256).",
      "The deb is pinned by sha256 and the extracted .so is re-pinned so verify.sh can catch a",
      "tampered or swapped library independently of the archive.",
      "",
      "mpg123 (libmpg123) is LGPL-2.1; shipping the shared library unmodified alongside our",
      "attribution satisfies it. See licenses/ATTRIBUTION.txt."
    ],
    "package": "libmpg123-0",
    "version": "1.25.10",
    "url": "https://launchpadlibrarian.net/360329959/libmpg123-0_1.25.10-1_arm64.deb",
    "deb_sha256": "bda129af2cf048f13215b12b38a32080e71ba9ddd260884b19593b1550c2d103",
    "member": "usr/lib/aarch64-linux-gnu/libmpg123.so.0.44.8",
    "so_sha256": "5b349374763a98a34ac20dfaaf86ed67e91d8a1c719c97732af97f26b21ac2f2",
    "install_path": "bin/lib/libmpg123.so.0"
  },
  "voxel_mod": {
    "_comment": [
      "WHY THIS IS DRAMALESS AND NOT DRAMATIC SHAPE -- a licensing decision, not a feature one.",
      "",
      "Through v0.3.0 this pak shipped DRAMATIC_SHAPE 1.7.2 from a community backup, because the",
      "author had deleted the original repo. That copy carries NO LICENSE file anywhere in its",
      "tree, and its README.md line 3 reads:",
      "  'Redistribution of non-derivative code is expressly prohibited after v1.6.0 without",
      "   permission.'",
      "So the pak was redistributing a work whose author had explicitly forbidden it. Every mirror",
      "of it (linkfy, scottcandy34, KhabirTheGoat, TeJota1337, Gmarcoel, blackwing182) reports no",
      "license, and the official mod index agrees.",
      "",
      "Of the community forks, exactly one is redistributable. DRAMALESS_SHAPE rebased onto the",
      "MIT-era upstream code, reverted the post-MIT changes (its 1.6.3 removed ForestFX/FogFX",
      "specifically for license compliance), and issues its own MIT grant -- shipped INSIDE the",
      "release zip, so attribution travels with the artifact. The rejected alternatives:",
      "  BATTLE_ART_VOXEL_FORK (absol89)   no license; forked at ~1.5.0, BEFORE MIT ever applied",
      "  potato_voxel (ShaneMcGovernIE)    no license -- the best performance fit, unshippable",
      "  TERRARIUM (BrenoBertucci)         no license",
      "The upstream MIT window was v1.5.4 to v1.6.0 only, narrower than the 'MIT until 1.6.2'",
      "story in circulation. Residual risk, stated rather than hidden: Dramaless names 1.6.1 as",
      "the last MIT upstream release, and the surviving MIT-tagged archive",
      "(ChristianSilvermoon/DramaticShapeVoxelMod-Archive) only reaches 1.6.0, so we cannot",
      "independently verify the grant at exactly 1.6.1. The repo also carries a ForkPermission.jpg",
      "which nobody here has read. An explicit grant beats an explicit prohibition; it is not a",
      "certification.",
      "",
      "Unlike DramaticShape this is a LIVE upstream, so the in-game update check against",
      "manifest.github actually resolves instead of 404ing. It also releases fast (five in six",
      "days at the time of pinning), so expect this pin to move often.",
      "",
      "archive_root exists because THIS ZIP IS NESTED and the old one was not: everything sits",
      "under a single DRAMALESS_SHAPE-<version>/ folder whose name changes every release. build.sh",
      "asserts this exact name is the sole top-level entry and strips it, so a layout change fails",
      "the build instead of installing a mod the loader cannot find an entry point in.",
      "",
      "The tree is shipped VERBATIM. There is nothing worth stripping: 2.0 dropped VR, the",
      "OpenXR loader, the Stadium models and the carved voxel sprites, taking the mod from 19 MB",
      "installed to 1.8 MB. What is left is lib/ (932K), data/ (268K) and assets/ (308K of",
      "markdown documentation only -- no runtime assets).",
      "",
      "WHY THIS IS STILL 2.0.1 AND NOT 2.0.2, checked 2026-08-16: the 2.0.2 release zip ships NO",
      "licence file anywhere in its tree, so build.sh refuses it ('voxel mod is missing LICENSE').",
      "That is the guard working, not a build fault -- attribution travelling inside the artifact",
      "is the whole reason this fork is the shippable one. The WORK is still licensed: LICENSE is",
      "present at the root of the repo at tag v2.0.2, so this reads as a packaging slip, and 2.0.2",
      "also converted every file CRLF -> LF, which is what a hand re-zip elsewhere would do. Asked",
      "for a re-cut in artyrambles/DRAMALESS_SHAPE#42; move the pin when an asset carries LICENSE.",
      "",
      "Nothing is lost by waiting. Ignoring line endings the whole 2.0.1 -> 2.0.2 delta is: the",
      "version string, the manifest game_version floor (>=0.1.37 -> >=0.1.87), and the removal of",
      "a baseroms/ folder holding one placeholder .txt. The author removed it because 0.1.91+",
      "blocks a mod archive with a non-empty baseroms/ -- but that check is in the install-from-zip",
      "path (LauncherMods._installZipInner), and we pre-stage into game/mods/ instead, so it never",
      "applies to the bundled copy. Confirmed on a Brick 2026-08-16: 2.0.1, baseroms/ and all, runs",
      "on 0.1.98. The author also reports 2.0.2 is slightly SLOWER, which a GPU-bound Brick cannot",
      "spend. Note the 2.0.2 release notes claim the zip was flattened; it was not -- the asset is",
      "still nested under DRAMALESS_SHAPE-2.0.2/, so archive_root above stays correct either way."
    ],
    "name": "DRAMALESS_SHAPE",
    "version": "2.0.1",
    "tag": "v2.0.1",
    "license": "MIT",
    "repo": "artyrambles/DRAMALESS_SHAPE",
    "url": "https://github.com/artyrambles/DRAMALESS_SHAPE/releases/download/v2.0.1/DRAMALESS_SHAPE-2.0.1.zip",
    "sha256": "4c824d47b566b88f9ac57b32ec40cb72cf74db95e2410727764b3ea93546fd72",
    "size": 557084,
    "archive_root": "DRAMALESS_SHAPE-2.0.1",
    "install_path": "game/mods/DRAMALESS_SHAPE",
    "_patches_comment": [
      "Patches applied to the mod at build time, in order. Each carries its full reasoning in",
      "its own header; this list only says which are live.",
      "",
      "These are not enhancements and must not become a place to put them. Each one exists",
      "because an upstream change broke the mod, is reported to the mod's author, and is to be",
      "DELETED when a mod release carries the fix -- not carried forward. build.sh fails closed",
      "if one stops applying, and verify.sh asserts the effect of each on the staged tree as",
      "well as the condition that makes it obsolete."
    ],
    "patches": [
      "patches/DRAMALESS_SHAPE-gbcfx.patch"
    ]
  },
  "contracts": {
    "_comment": [
      "Assumptions launch.sh hard-codes. verify.sh asserts each against the staged payload so",
      "an upstream change breaks the build loudly instead of producing a black screen on device."
    ],
    "love_version": "11.5",
    "love_identity": "pokemon-love2d",
    "_shaderfx_comment": [
      "What replaced POKEPORT_GBCFX, and why launch.sh now exports nothing in its place.",
      "",
      "Through 0.2.20 the engine had src/render/GBCFX.lua: a fixed shader 'level ladder' that",
      "compiled its present pass on this GPU class and then displayed a BLACK FRAME (upstream",
      "issue #136), so launch.sh pinned it off with POKEPORT_GBCFX=0. Between 0.2.20 and 0.2.24",
      "upstream DELETED that module, replacing it with src/render/ShaderFX.lua -- runtime",
      "libretro slang-shader presets, backed by liblibrashader_bridge.so.",
      "",
      "POKEPORT_SHADERFX is not a replacement switch. It names a PRESET to auto-activate, and",
      "unset already means 'no shader', so there is nothing for launch.sh to set. The export was",
      "deleted rather than translated: a dead env var that reads like a safety guard is worse",
      "than none, because the next person to read launch.sh would trust it.",
      "",
      "What actually keeps the black frame from returning is the performance tier.",
      "Performance.detect() returns 'low' for arm/arm64 on Linux -- every device this pak",
      "targets -- and CAPS.low.shaderfx is false: a hard off, read before any preset is",
      "considered. The pak ships no .slangp and a fresh save dir has none, so the tier is",
      "belt and braces rather than the only thing standing in the way.",
      "",
      "verify.sh asserts the tier rule and the cap against the payload, so an upstream change to",
      "either fails the build here instead of showing up as a black screen on a device.",
      "The old module is asserted ABSENT too: if it returns, patches/DRAMALESS_SHAPE-gbcfx.patch",
      "is obsolete and must be deleted rather than carried."
    ],
    "shaderfx": {
      "module": "src/render/ShaderFX.lua",
      "removed_module": "src/render/GBCFX.lua",
      "removed_env": "POKEPORT_GBCFX",
      "preset_env": "POKEPORT_SHADERFX",
      "tier_fn": "Performance.detect",
      "arm_linux_tier": "low",
      "tier_caps_table": "Performance.CAPS",
      "bridge_lib": "liblibrashader_bridge.so"
    },
    "_legacy_mod_ids_comment": [
      "Mod ids this pak used to install and must now remove on sight. A pak update MERGES over",
      "the old install rather than replacing it, so a card coming from v0.3.0 keeps",
      "game/mods/DRAMATIC_SHAPE/ after the update -- and the failure that produces is silent and",
      "backwards.",
      "",
      "DRAMALESS_SHAPE's manifest declares conflicts:['DRAMATIC_SHAPE',...], and the engine's",
      "conflict rule is that THE DECLARING MOD LOSES (src/mods/Loader.lua, _enforceConflicts:",
      "'the declaring mod loses: it asserted the incompatibility'). Both folders present means",
      "both mods enabled -- neither sets 'experimental', and the loader enables anything that",
      "does not -- so the NEW mod is the one that fails and the player silently keeps running the",
      "old unlicensed one.",
      "",
      "launch.sh therefore deletes each of these from the pak's own game/mods/ on every launch,",
      "and verify.sh fails if one is ever staged into a build. A copy the PLAYER installed into",
      "their save directory is only reported, never deleted -- that one is theirs."
    ],
    "legacy_mod_ids": [
      "DRAMATIC_SHAPE"
    ],
    "_mod_index_comment": [
      "The official Gen1Recomp mod catalogue, published by the engine's own author. The engine",
      "ships NO index configured and asks the player to add one, because adding a feed means",
      "trusting whoever publishes it (src/mods/ModIndex.lua). launch.sh enters this one exactly",
      "once, on a genuinely fresh install, because the 'ask' on a handheld means typing a URL on",
      "a d-pad keyboard.",
      "",
      "ModIndex.resolveSource expands a bare owner/repo into feed/base/fallback/label; launch.sh",
      "reproduces that expansion, and verify.sh asserts the owner and repo here match the copy",
      "in launch.sh so the two cannot drift.",
      "",
      "This is only ever metadata. Every install still goes through the same confirmation the",
      "'Import mod .zip' path uses, so a listing buys a mod no trust it would not otherwise have."
    ],
    "mod_index": {
      "owner": "bryanthaboi",
      "repo": "gen1recomp-mod-index",
      "feed": "https://bryanthaboi.github.io/gen1recomp-mod-index/data/index.json"
    },
    "_rom_sha1_comment": [
      "The identifiers upstream publishes, and what the engine itself verifies at",
      "import time. Asserted against the payload so an upstream change is caught,",
      "but NOT used by launch.sh -- see rom_sha256."
    ],
    "rom_sha1": {
      "red": "ea9bcae617fdf159b045185467ae58b2e4a48b9a",
      "blue": "d7037c83e1ae5b39bde3c30787637ba1d4c48ce2",
      "yellow": "cc7d03262ebfaf2f06772c1a480c7d9d5f4a38e1",
      "gold": "d8b8a3600a465308c9953dfa04f0081c05bdcb94"
    },
    "_rom_sha256_comment": [
      "What launch.sh actually matches on. These devices ship sha256sum and md5sum",
      "but NO sha1sum (verified on a Trimui Brick, 2026-08-11), so the original",
      "SHA-1 scan matched nothing at all -- silently. Red and Blue were confirmed",
      "against real dumps on-device; Yellow followed by elimination from the same",
      "published set and was later confirmed by a real import. Gold was confirmed",
      "the same way on a Brick, 2026-08-13: the dump's SHA-1 matches GameVersion's",
      "gold row and the engine decoded it to gold/rom-cache.complete.",
      "A wrong value fails safe: the engine's own SHA-1 check still gates the",
      "import, so the player lands on Choose ROM, not on bad data.",
      "",
      "GOLD IS 2 MiB, not 1. launch.sh filters candidates by size before hashing, and",
      "a 1 MiB-only filter skipped every Gold dump before its hash was computed --",
      "reporting nothing wrong. The engine accepts both sizes",
      "(RomImporter.isAcceptedRomSize); the filter must accept both too."
    ],
    "rom_sha256": {
      "red": "5ca7ba01642a3b27b0cc0b5349b52792795b62d3ed977e98a09390659af96b7b",
      "blue": "2a951313c2640e8c2cb21f25d1db019ae6245d9c7121f754fa61afd7bee6452d",
      "yellow": "8cbaa499397e4f1a679c992ea9382a2dd7942ab398b48c19829c2d9529de47bf",
      "gold": "fb0016d27b1e5374e1ec9fcad60e6628d8646103b5313ca683417f52b97e7e4e"
    },
    "_device_tools_comment": [
      "Commands confirmed ABSENT on a Trimui Brick and a Smart Pro S running NextUI",
      "(2026-08-11). launch.sh must not invoke any of these unless guarded by",
      "`command -v`, because the failure mode is silent: sha1sum produced no output and",
      "the ROM scan matched nothing, with no error logged anywhere. verify.sh enforces it.",
      "taskset is absent even from busybox, which is why big-core affinity uses a cpuset",
      "cgroup instead."
    ],
    "device_missing_tools": [
      "sha1sum",
      "stat",
      "openssl",
      "cksum",
      "nproc",
      "taskset"
    ],
    "_rom_discovery_comment": [
      "How the engine finds a dump on Linux, and therefore where launch.sh stages one.",
      "RomImporter.lua gates its baseroms/ scan behind baseRomDiscovery, which is set to",
      "`opts.launcher and Platform.isUWP()` -- Xbox only. On Linux it tries zenity/kdialog",
      "(absent on these handhelds) and then falls back to findPendingRom(), which scans the",
      "PhysFS root via getDirectoryItems(\"\") for a 1 MiB .gb/.gbc. LOVE mounts the save",
      "directory into that root, so launch.sh stages dumps at the top of the save dir.",
      "Staging them in a subfolder is invisible to the engine -- that cost a device trip.",
      "verify.sh asserts both facts so an upstream change to either is caught here."
    ],
    "rom_discovery": {
      "root_scan_fn": "findPendingRom",
      "root_scan_call": "getDirectoryItems(\"\")",
      "baseroms_is_uwp_only": true,
      "stage_at": "<savedir>/  (PhysFS root)"
    }
  },
  "ca_bundle": {
    "_comment": [
      "These devices ship NO CA store at all -- /etc/ssl/certs, /etc/ssl/cert.pem and",
      "/etc/pki are all absent. The engine does HTTPS by shelling out to curl",
      "(src/net/Fetch.lua, HostShell.httpGet via io.popen), so every request failed with",
      "curl exit 60, CURLE_PEER_FAILED_VERIFICATION -- which surfaced in the mod manager",
      "as a failed update check. Verified on a Trimui Brick, 2026-08-11: with",
      "CURL_CA_BUNDLE set, the same request returns HTTP 200.",
      "",
      "Mozilla's bundle as republished by the curl project. Pinned for reproducibility,",
      "so refreshing it is a deliberate act: run scripts/build.sh --refresh-ca, check the",
      "new hash in, and note that roots do expire -- a stale bundle fails closed and",
      "silently, exactly like having none."
    ],
    "url": "https://curl.se/ca/cacert.pem",
    "sha256": "f66dff1bdf8f96060b8177976f8b7d9254bc89bc4db933d769f7384d28480bc9",
    "mozilla_date": "2026-08-13",
    "install_path": "assets/ca-certificates.crt"
  }
